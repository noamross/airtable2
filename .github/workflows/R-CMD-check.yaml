# Workflow derived from https://github.com/r-lib/actions/tree/v2/examples
# Need help debugging build failures? Start at https://github.com/r-lib/actions#where-to-find-help
on:
  push:
    branches: [main, master]
  pull_request:

name: R-CMD-check.yaml

permissions: read-all

jobs:
  R-CMD-check:
    runs-on: ${{ matrix.config.os }}

    name: ${{ matrix.config.label }}

    strategy:
      fail-fast: true
      matrix:
        config:
          - {os: macos-latest,   r: 'release',  label: 'macos-release-standard'}
          - {os: windows-latest, r: 'release',  label: 'windows-release-standard'}
          - {os: ubuntu-latest,  r: 'devel',    http-user-agent: 'release', label: 'ubuntu-devel-standard'}
          - {os: ubuntu-latest,  r: 'release',  label: 'ubuntu-release-standard'}
          - {os: ubuntu-latest,  r: 'oldrel-1', label: 'ubuntu-oldrel-1-standard'}

    environment: standard-testing

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes

    steps: &check_steps
      - uses: actions/checkout@v6

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ matrix.config.r || 'release' }}
          http-user-agent: ${{ matrix.config.http-user-agent }}

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::rcmdcheck
          needs: check

      - uses: r-lib/actions/check-r-package@v2
        with:
          upload-snapshots: true
          build_args: 'c("--no-manual","--compact-vignettes=gs+qpdf")'

  R-CMD-check-protected:
    runs-on: ubuntu-latest

    name: ubuntu-release-protected

    needs: R-CMD-check

    environment: protected-testing

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes
      AIRTABLE_WORKSPACE_ID: ${{ secrets.AIRTABLE_WORKSPACE_ID }}
      AIRTABLE_API_KEY: ${{ secrets.AIRTABLE_API_KEY }}
      AIRTABLE_TEST_SCHEMA: ${{ vars.AIRTABLE_TEST_SCHEMA }}
      AIRTABLE_TEST_LIVE: ${{ vars.AIRTABLE_TEST_LIVE }}

    steps: *check_steps
